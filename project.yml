# XcodeGen project definition. The .xcodeproj is generated from this file
# in the cloud (Codemagic), so there is no Xcode project to keep in git.
name: KickoffManager

options:
  bundleIdPrefix: com.kickoffmanager
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  GameEngine:
    path: Packages/GameEngine

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic

targets:
  KickoffManager:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: GameEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kickoff Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Change this to the bundle ID you register in App Store Connect.
        PRODUCT_BUNDLE_IDENTIFIER: com.kickoffmanager.game
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  KickoffManager:
    build:
      targets:
        KickoffManager: all
    archive:
      config: Release
