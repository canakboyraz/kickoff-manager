# XcodeGen project definition. The .xcodeproj is generated from this file
# in the cloud (Codemagic), so there is no Xcode project to keep in git.
name: KickoffManager

options:
  bundleIdPrefix: com.canakboyraz
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  GameEngine:
    path: Packages/GameEngine
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    majorVersion: 11.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic

targets:
  KickoffManager:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: GameEngine
      - package: GoogleMobileAds
      - sdk: StoreKit.framework
      - sdk: AppTrackingTransparency.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kickoff Manager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # AdMob. This is Google's public TEST app ID; replace it with your own AdMob app ID.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        NSUserTrackingUsageDescription: Your data is used to show you more relevant ads. You can still play for free if you decline.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
    settings:
      base:
        # Change this to the bundle ID you register in App Store Connect.
        PRODUCT_BUNDLE_IDENTIFIER: com.canakboyraz.kickoffmanager
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  KickoffManager:
    build:
      targets:
        KickoffManager: all
    archive:
      config: Release
