# Runs the game engine tests on Linux for every push (cheap and fast).
# The iOS app itself is built by Codemagic (see codemagic.yaml).
name: Engine tests

on:
  push:
    branches-ignore: ['ci-logs-*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        working-directory: Packages/GameEngine
        shell: bash
        run: |
          status=0
          swift test > test.log 2>&1 || status=$?
          tail -30 test.log
          exit $status
      - name: Publish log to ci-logs branch
        if: always()
        shell: bash
        env:
          LOG_NAME: engine
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/ci-logs && cp Packages/GameEngine/test.log /tmp/ci-logs/$LOG_NAME.log 2>/dev/null || echo "no log" > /tmp/ci-logs/$LOG_NAME.log
          cd /tmp/ci-logs
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-logs-$LOG_NAME
          git add -A
          git commit -qm "log for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs-$LOG_NAME
