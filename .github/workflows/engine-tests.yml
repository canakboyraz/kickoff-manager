# Runs the game engine tests on Linux for every push (cheap and fast).
# The iOS app itself is built by Codemagic (see codemagic.yaml).
name: Engine tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        working-directory: Packages/GameEngine
        shell: bash
        run: |
          set -o pipefail
          status=0
          swift test > test.log 2>&1 || status=$?
          tail -30 test.log
          # Surface compile errors and failed assertions as annotations.
          grep -E "error:|failed \(|XCTAssert" test.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit $status
