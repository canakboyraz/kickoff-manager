# Compiles the iOS app on a GitHub macOS runner (no signing) to catch build errors
# early. Shipping to TestFlight is done by Codemagic (see codemagic.yaml).
name: App build check

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project KickoffManager.xcodeproj \
            -scheme KickoffManager \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          # Surface compiler errors as annotations (readable from the API without log access).
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
