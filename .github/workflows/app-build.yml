# Compiles the iOS app on a GitHub macOS runner (no signing) to catch build errors
# early. Shipping to TestFlight is done by Codemagic (see codemagic.yaml).
name: App build check

on:
  push:
    branches-ignore: ['ci-logs-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project KickoffManager.xcodeproj \
            -scheme KickoffManager \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Publish log to ci-logs branch
        if: always()
        shell: bash
        env:
          LOG_NAME: app
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /tmp/ci-logs && cp build.log /tmp/ci-logs/$LOG_NAME.log 2>/dev/null || echo "no log" > /tmp/ci-logs/$LOG_NAME.log
          cd /tmp/ci-logs
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-logs-$LOG_NAME
          git add -A
          git commit -qm "log for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-logs-$LOG_NAME
